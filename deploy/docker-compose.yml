# Bakht Stroy on one server: docker compose --env-file .env up -d --build   (run inside deploy/)
# See docs/DEPLOY.md. Every secret lives in deploy/.env (not in git).

name: bakhtstroy

x-backend-env: &backend-env
  env_file: .env
  environment:
    APP_ENV: ${APP_ENV:-production}
    APP_URL: https://${API_DOMAIN}
    FRONTEND_URL: https://${SITE_DOMAIN}
    # EXTRA_SITE_HOST: a second address of the site (e.g. the Vercel demo); empty = only SITE_DOMAIN.
    CORS_ALLOWED_ORIGINS: https://${SITE_DOMAIN},https://${EXTRA_SITE_HOST:-${SITE_DOMAIN}}
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: ${DB_DATABASE:-bakhtstroy}
    DB_USERNAME: ${DB_USERNAME:-bakhtstroy}
    DB_PASSWORD: ${DB_PASSWORD}
    # Laravel talks to Reverb inside the Docker network; browsers come through Caddy (wss://API_DOMAIN).
    BROADCAST_CONNECTION: reverb
    REVERB_HOST: reverb
    REVERB_PORT: 8080
    REVERB_SCHEME: http
    REVERB_ALLOWED_ORIGINS: ${SITE_DOMAIN},${EXTRA_SITE_HOST:-${SITE_DOMAIN}}
    QUEUE_CONNECTION: database
    LOG_CHANNEL: stderr
    # Requests come through Caddy and the Next.js server inside this private network.
    TRUSTED_PROXIES: 172.16.0.0/12,10.0.0.0/8,192.168.0.0/16

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-bakhtstroy}
      POSTGRES_USER: ${DB_USERNAME:-bakhtstroy}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-bakhtstroy} -d ${DB_DATABASE:-bakhtstroy}"]
      interval: 10s
      retries: 10

  api:
    build: { context: ../backend, target: web }
    restart: unless-stopped
    <<: *backend-env
    volumes:
      - storage:/var/www/html/storage/app
    depends_on:
      postgres: { condition: service_healthy }

  reverb:
    build: { context: ../backend, target: worker }
    restart: unless-stopped
    <<: *backend-env
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    depends_on: [api]

  queue:
    build: { context: ../backend, target: worker }
    restart: unless-stopped
    <<: *backend-env
    volumes:
      - storage:/var/www/html/storage/app
    depends_on: [api]

  scheduler:
    build: { context: ../backend, target: worker }
    restart: unless-stopped
    <<: *backend-env
    command: ["php", "artisan", "schedule:work"]
    depends_on: [api]

  web:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN}/api/v1
        NEXT_PUBLIC_SITE_URL: https://${SITE_DOMAIN}
        NEXT_PUBLIC_REVERB_KEY: ${REVERB_APP_KEY}
        NEXT_PUBLIC_REVERB_HOST: ${API_DOMAIN}
        NEXT_PUBLIC_REVERB_PORT: 443
        NEXT_PUBLIC_REVERB_SCHEME: https
    restart: unless-stopped
    environment:
      # The site's server talks to the API directly inside the network (fast, no HTTPS round trip).
      API_URL: http://api:8080/api/v1
    depends_on: [api]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api, reverb]

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:
